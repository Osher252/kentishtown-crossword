name: Generate Daily Puzzle & Bee

on:
  schedule:
    # Run at midnight UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --legacy-peer-deps

      - name: Generate tomorrow's crossword
        run: node_modules/.bin/tsx scripts/generate-puzzle.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate tomorrow's spelling bee
        run: node_modules/.bin/tsx scripts/generate-bee.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "Puzzle Bot"
          git config user.email "bot@kentishtown.local"
          git add puzzles/ bees/
          git diff --staged --quiet || git commit -m "Add puzzles for $(date -u +%Y-%m-%d)"
          git push
